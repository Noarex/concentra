# concentra ayarlari (bash sozdizimi)
# Degisiklikler bir sonraki kontrolde (en gec 1 dakika) gecerli olur.
# Kendi eklemelerini /etc/concentra.d/*.conf dosyalarina da yazabilirsin;
# o dosyalar bu dosyadan sonra okunur. Ornek: UYGULAMALAR+=(moonlight)

# Otomatik planin saatleri (odak hafta / odak full)
PLAN_BAS="07:30"
PLAN_BIT="20:00"

# Planlarin gecerli oldugu gunler: 1=Pazartesi 2=Sali 3=Carsamba 4=Persembe 5=Cuma 6=Cumartesi 7=Pazar
# Ornek: Cumartesi tatil olsun -> FULL_GUNLER="1 2 3 4 5 7"
HAFTA_GUNLER="1 2 3 4 5"
FULL_GUNLER="1 2 3 4 5 6 7"

# Mola suresi (dakika). Her mola o gunun bitisine eklenir.
MOLA_DK=15

# Plan kapatma / duraklatma / gevsetme taleplerinin bekleme suresi (gun)
BEKLEME_GUN=3
ARA_MAX_GUN=14

# Tarayicida engellenen siteler (Brave/Chromium/Chrome/Firefox politikasi)
SITELER=(twitch.tv kick.com x.com twitter.com instagram.com discord.com discord.gg discordapp.com)

# /etc/hosts ile engellenen alan adlari (her tarayicida ve uygulamada gecerli)
HOSTS_ADLAR=(twitch.tv www.twitch.tv m.twitch.tv kick.com www.kick.com x.com www.x.com
             twitter.com www.twitter.com mobile.twitter.com instagram.com www.instagram.com
             discord.com www.discord.com ptb.discord.com canary.discord.com gateway.discord.gg
             discord.gg discordapp.com cdn.discordapp.com media.discordapp.net)

# YouTube abonelik akisini (youtube.com/feed/subscriptions) engelle: evet / hayir
YT_ABONELIK_ENGELLE=evet

# Odak sirasinda kapatilan uygulamalar (surec adlari, pkill -x)
UYGULAMALAR=(Discord DiscordPTB DiscordCanary discord vesktop legcord webcord)

# Engel her basladiginda kapatilan tarayicilar (acik sekmeler yeniden acilinca engellenir)
TARAYICILAR=(brave chromium chrome firefox)

# Tailscale uzerinden giden butun trafigi kes: evet / hayir
TAILSCALE_ENGELLE=hayir

# Baglantisi kesilecek IP adresleri (IPv4 ya da IPv6)
ENGELLI_IPLER=()

# YouTube izin listesinin ilk kurulumdaki icerigi.
# Sonrasi icin: odak kanal ekle|sil @kanal
VARSAYILAN_KANALLAR=(@ProfessorLeonard @TheOrganicChemistryTutor @3blue1brown @DrTrefor
                     @kristakingmath @patrickjmt @khanacademy @mitocw)
