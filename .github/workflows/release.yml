# odak icindeki SURUM her degistiginde o surum icin GitHub release acar.
# Eksik kalmis eski surumleri de (eskiden yeniye) tamamlar.
name: release
on:
  push:
    branches: [main]
    paths: [odak]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Eksik release'leri ac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          onceki=""
          for c in $(git log --reverse --format=%H -G '^SURUM=' -- odak); do
            s=$(git show "$c:odak" | sed -n 's/^SURUM="\(.*\)"$/\1/p')
            [ -n "$s" ] && [ "$s" != "$onceki" ] || continue
            onceki="$s"
            if gh release view "v$s" >/dev/null 2>&1; then echo "v$s zaten var"; continue; fi
            if git rev-parse -q --verify "refs/tags/v$s" >/dev/null; then
              gh release create "v$s" --verify-tag --title "concentra $s" --generate-notes
            else
              gh release create "v$s" --target "$c" --title "concentra $s" --generate-notes
            fi
          done
